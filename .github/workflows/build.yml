name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: cross/go.mod }
      - run: cd cross && go vet ./... && go test ./...

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: cross/go.mod }
      - name: Build
        shell: bash
        run: ./scripts/build-cross.sh windows/amd64 windows/arm64
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $v = (Get-Content VERSION).Trim()
          & $iscc "/DAppVersion=$v" packaging\windows\ontutunnel.iss
      - name: Portable zips
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          Compress-Archive -Path dist\windows-amd64\ontutunnel.exe, LICENSE -DestinationPath "dist\OntuTunnel-$v-windows-x64-portable.zip"
          Compress-Archive -Path dist\windows-arm64\ontutunnel.exe, LICENSE -DestinationPath "dist\OntuTunnel-$v-windows-arm64-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/OntuTunnel-Setup-*.exe
            dist/*.zip

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: cross/go.mod }
      - name: Build
        run: ./scripts/build-cross.sh linux/amd64 linux/arm64
      - name: Packages (.deb, .rpm, .tar.gz)
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          V=$(cat VERSION)
          for ARCH in amd64 arm64; do
            export ARCH VERSION=$V
            nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist/
            nfpm package -f packaging/linux/nfpm.yaml -p rpm -t dist/
            d=OntuTunnel-$V-linux-$ARCH; mkdir -p $d
            cp dist/linux-$ARCH/ontutunnel LICENSE packaging/linux/ontutunnel.desktop packaging/linux/ontutunnel.png packaging/linux/ontutunnel.service $d/
            tar czf dist/$d.tar.gz $d
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

  macos:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: DMG (universal)
        run: ./scripts/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=docs/releases/${GITHUB_REF_NAME}.md
          [ -f "$notes" ] || notes=/dev/null
          gh release create "$GITHUB_REF_NAME" out/* --title "OntuTunnel ${GITHUB_REF_NAME#v}" --notes-file "$notes"
