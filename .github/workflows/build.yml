name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: cross/go.mod }
      - run: cd cross && go vet ./... && go test ./...

  server-scenarios:
    # the real server scripts, several computers sharing one nginx / Caddy server
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: cross/go.mod }
      - name: nginx (shared by 3 computers)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nginx certbot
          sudo systemctl start nginx
          cd cross && OT_SCENARIO=nginx go test -count=1 -v -run 'TestScenarioNginx|TestScenarioStalePortsOnlySSH' ./...
      - name: Caddy (shared by 3 computers)
        run: |
          sudo systemctl stop nginx
          cd cross && OT_SCENARIO=caddy go test -count=1 -v -run TestScenarioCaddy ./...

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: cross/go.mod }
      - name: Build
        shell: bash
        run: ./scripts/build-cross.sh windows/amd64 windows/arm64
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $v = (Get-Content VERSION).Trim()
          & $iscc "/DAppVersion=$v" packaging\windows\ontutunnel.iss
      - name: Unit tests on Windows
        shell: bash
        run: cd cross && go test -count=1 ./...
      - name: End-to-end check of the Windows app
        shell: pwsh
        run: ./.github/scripts/windows-smoke.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke
          path: dist/smoke/
      - name: Portable zips
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          Compress-Archive -Path dist\windows-amd64\ontutunnel.exe, LICENSE -DestinationPath "dist\OntuTunnel-$v-windows-x64-portable.zip"
          Compress-Archive -Path dist\windows-arm64\ontutunnel.exe, LICENSE -DestinationPath "dist\OntuTunnel-$v-windows-arm64-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/OntuTunnel-Setup-*.exe
            dist/*.zip

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: cross/go.mod }
      - name: Build
        run: ./scripts/build-cross.sh linux/amd64 linux/arm64
      - name: Packages (.deb, .rpm, .tar.gz)
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          V=$(cat VERSION)
          for ARCH in amd64 arm64; do
            sed -e "s/\${ARCH}/$ARCH/g" -e "s/\${VERSION}/$V/g" packaging/linux/nfpm.yaml > nfpm-$ARCH.yaml
            nfpm package -f nfpm-$ARCH.yaml -p deb -t dist/
            nfpm package -f nfpm-$ARCH.yaml -p rpm -t dist/
            d=OntuTunnel-$V-linux-$ARCH; mkdir -p $d
            cp dist/linux-$ARCH/ontutunnel LICENSE packaging/linux/ontutunnel.desktop packaging/linux/ontutunnel.png packaging/linux/ontutunnel.service $d/
            tar czf dist/$d.tar.gz $d
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

  macos:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && swift --version
      - name: DMG (universal)
        run: ./scripts/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos, server-scenarios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # only the packages, not the test results
      - uses: actions/download-artifact@v4
        with: { name: windows, path: out }
      - uses: actions/download-artifact@v4
        with: { name: linux, path: out }
      - uses: actions/download-artifact@v4
        with: { name: macos, path: out }
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=docs/releases/${GITHUB_REF_NAME}.md
          [ -f "$notes" ] || notes=/dev/null
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/* --title "OntuTunnel ${GITHUB_REF_NAME} · macOS, Windows & Linux" --notes-file "$notes"
          fi
